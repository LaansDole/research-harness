<img class="only-light" src="../diagrams/architecture-light.svg" width="1356" height="1068" loading="lazy" alt="Architecture diagram. A researcher uses either research web, a browser on 127.0.0.1 with chat, reading list, reviews, graph and PRISMA, or the research terminal app, with its branded welcome, /help and statusline progress. The browser talks over a WebSocket and /api to the research-web server (Bun.serve), which checks Host and Origin, passes only allowed commands to the agent over /ws, serves /api/* with research state read-only, and starts one omp --mode rpc agent per tab. Both front ends reach the same omp agent session in research mode: system.md plus 13 commands from /scope to /export, and four agents: scholar, screener, synthesizer and librarian. Its commands run python3 standard-library scripts (review.py, prisma_scr.py, fetch_paper.py, local_library.py, paper_graph.py, graph_viz.py, the jev scripts), which write review.db (per project: records and history in PRISMA-ScR states) and papers.db (the paper graph with typed links), and fetch open-access PDFs through OpenAlex, Unpaywall and arXiv. A local PDF corpus is read-only. A dashed line shows the server reading review.db." />
<img class="only-dark" src="../diagrams/architecture.svg" width="1356" height="1068" loading="lazy" alt="Architecture diagram. A researcher uses either research web, a browser on 127.0.0.1 with chat, reading list, reviews, graph and PRISMA, or the research terminal app, with its branded welcome, /help and statusline progress. The browser talks over a WebSocket and /api to the research-web server (Bun.serve), which checks Host and Origin, passes only allowed commands to the agent over /ws, serves /api/* with research state read-only, and starts one omp --mode rpc agent per tab. Both front ends reach the same omp agent session in research mode: system.md plus 13 commands from /scope to /export, and four agents: scholar, screener, synthesizer and librarian. Its commands run python3 standard-library scripts (review.py, prisma_scr.py, fetch_paper.py, local_library.py, paper_graph.py, graph_viz.py, the jev scripts), which write review.db (per project: records and history in PRISMA-ScR states) and papers.db (the paper graph with typed links), and fetch open-access PDFs through OpenAlex, Unpaywall and arXiv. A local PDF corpus is read-only. A dashed line shows the server reading review.db." />
